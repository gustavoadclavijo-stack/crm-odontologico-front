<button
  class="diente-container"
  [class.is-selected]="seleccionado()"
  [class.has-finding]="estado() !== 'Sano'"
  [class.upper-tooth]="numeroDiente() < 30"
  [class.lower-tooth]="numeroDiente() >= 30"
  [attr.aria-label]="'Seleccionar diente ' + numeroDiente() + ', estado ' + estado()"
  [attr.aria-pressed]="seleccionado()"
  type="button"
  (click)="onDienteClick()">
  @if (numeroDiente() < 30) {
    <span class="diente-numero">{{ numeroDiente() }}</span>
  }

  <svg viewBox="0 0 100 130" class="diente-svg" aria-hidden="true">
    @switch (forma()) {
      @case ('incisivo') {
        <path class="raiz" d="M29 51c2 19 6 40 14 57 3 5 7 5 9-1 7-20 11-39 13-57" />
        <path class="corona" d="M27 52c-12-5-17-16-13-29C18 8 34 8 50 11c17-3 32-3 37 12 4 13-1 24-14 29-11 5-35 5-46 0Z" />
        <path class="brillo" d="M26 22c5-7 12-8 19-8" />
      }
      @case ('canino') {
        <path class="raiz" d="M34 43c1 24 5 47 12 67 2 7 7 7 9 0 8-21 11-44 12-67" />
        <path class="corona" d="M27 48C12 41 13 23 23 15c7-6 15-3 27-12 12 9 20 6 27 12 10 8 11 26-4 33-10 5-36 5-46 0Z" />
        <path class="brillo" d="M29 23c5-7 11-8 18-11" />
      }
      @case ('premolar') {
        <path class="raiz" d="M28 52c0 21 5 37 13 52 3 5 8 5 10 0 2-6 4-6 7 0 3 5 8 5 10 0 8-15 13-31 13-52" />
        <path class="corona" d="M28 53C15 49 12 35 17 21 22 8 36 8 50 14c14-6 28-6 33 7 5 14 2 28-11 32-12 5-32 5-44 0Z" />
        <path class="brillo" d="M27 23c5-8 12-9 19-7" />
      }
      @default {
        <path class="raiz" d="M23 51c-1 18 2 34 9 48 3 6 8 6 11 0l7-15 7 15c3 6 8 6 11 0 7-14 10-30 9-48" />
        <path class="corona" d="M24 54C9 48 8 31 16 19 24 7 37 10 50 16 63 10 76 7 84 19c8 12 7 29-8 35-13 6-39 6-52 0Z" />
        <path class="brillo" d="M25 25c5-8 13-9 20-7" />
      }
    }
  </svg>

  @if (numeroDiente() >= 30) {
    <span class="diente-numero">{{ numeroDiente() }}</span>
  }
</button>
